# Автоматические обновления зависимостей.
# Мелкие обновления собираются в один запрос на слияние, мажорные версии
# основы стека (Django LTS, Python, PostgreSQL, Redis) меняются вручную.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Проект остаётся на LTS-ветке Django 5.2.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      # Клиент redis 8 требует kombu 5.7, у которой пока нет стабильного выпуска.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(docker)"
    ignore:
      # Версия Python меняется вместе с .python-version и проверкой совместимости.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build(docker)"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
