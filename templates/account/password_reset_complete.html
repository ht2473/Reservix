{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Пароль изменён" %}{% endblock %}

{% block content %}
  <div class="container container--narrow">
    <div class="card mt-8">
      <div class="card__body text-center">
        <span class="badge badge--ready badge--pill mb-4">{% icon "check-circle" 16 %}</span>
        <h1 class="page-header__title mb-3">{% translate "Пароль изменён" %}</h1>
        <p class="text-muted mb-6">{% translate "Теперь вы можете войти в систему с новым паролем." %}</p>
        <a class="btn btn--primary" href="{% url 'accounts:login' %}">{% translate "Войти" %}</a>
      </div>
    </div>
  </div>
{% endblock %}
