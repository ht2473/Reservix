{# Сообщения сервера. #}

{% if messages %}
  <div class="visually-hidden" aria-live="polite">
    {% for message in messages %}
      <span data-server-message="{{ message.level_tag|default:'info' }}">{{ message }}</span>
    {% endfor %}
  </div>

  {# Запасной вывод для случая, когда сценарии недоступны. #}
  <noscript>
    <div class="container mb-4">
      {% for message in messages %}
        <div class="alert alert--{{ message.level_tag|default:'info' }}">{{ message }}</div>
      {% endfor %}
    </div>
  </noscript>
{% endif %}
