# =============================================================================
# Reservix — развёртывание в продакшене
# Запуск на сервере: cd deploy && docker compose --env-file ../.env up -d
# --build Состав: обратный прокси, приложение, база данных, кеш и брокер, воркер
# фоновых задач, планировщик расписаний.
# =============================================================================

name: reservix

services:

  # --- Обратный прокси -------------------------------------------------------
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/reservix.conf:/etc/nginx/conf.d/default.conf:ro
      # Каталог подключаемых фрагментов монтируется целиком: добавление
      # нового фрагмента не требует правки конфигурации compose.
      - ./nginx:/etc/nginx/snippets:ro
      - nginx_cache:/var/cache/nginx
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

  # --- Приложение ------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: reservix:latest
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - app_logs:/app/logs
    # Миграции и сбор статики выполняются при старте: развёртывание сводится
    # к одной команде, а состояние базы всегда соответствует коду образа.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers ${GUNICORN_WORKERS:-3}
               --threads ${GUNICORN_THREADS:-2}
               --timeout 60
               --graceful-timeout 30
               --max-requests 1000
               --max-requests-jitter 100
               --access-logfile -
               --error-logfile -"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # --- Фоновые задачи --------------------------------------------------------
  worker:
    image: reservix:latest
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - media_files:/app/media
      - app_logs:/app/logs
    # Очереди перечислены явно: воркер обслуживает все, но при росте нагрузки
    # достаточно поднять отдельный контейнер на тяжёлую очередь `analytics`.
    command: >
      celery -A config worker
        --loglevel=info
        --concurrency=${CELERY_CONCURRENCY:-2}
        --queues=default,analytics,reports,notifications
        --max-tasks-per-child=200
    depends_on:
      web:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # --- Планировщик периодических задач ---------------------------------------
  beat:
    image: reservix:latest
    restart: unless-stopped
    env_file: [../.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - app_logs:/app/logs
    # Расписание хранится в базе: администратор меняет его через панель
    # управления, не пересобирая образ и не перезапуская контейнер.
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      web:
        condition: service_healthy
    networks: [backend]

  # --- База данных -----------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Сортировка кириллицы задаётся провайдером ICU: образ на Alpine
      # использует musl и системных локалей ru_RU не содержит.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru-RU --locale=C.UTF-8"
    volumes:
      # PostgreSQL 18 размещает данные в подкаталоге: том монтируется
      # на /var/lib/postgresql, а не на /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - db_backups:/backups
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=8MB
        -c maintenance_work_mem=64MB
        -c random_page_cost=1.1
        -c log_min_duration_statement=500

  # --- Кеш и брокер ----------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [backend]
    # allkeys-lru: при исчерпании памяти вытесняются давно не используемые
    # ключи кеша. Очереди Celery живут в отдельных базах и не страдают.
    command: >
      redis-server
        --appendonly yes
        --maxmemory ${REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy allkeys-lru
        --save 900 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Выпуск и продление сертификатов ---------------------------------------
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Проверка каждые 12 часов — рекомендация Let's Encrypt: сертификат
    # продлевается за 30 дней до истечения, точное время роли не играет.
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"
    networks: [frontend]

networks:
  # Внешняя сеть: только nginx и приложение.
  frontend:
    driver: bridge
  # Внутренняя сеть: база и Redis недоступны извне.
  backend:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  nginx_cache:
  static_files:
  media_files:
  app_logs:
  db_backups:
  certbot_certs:
  certbot_www:
