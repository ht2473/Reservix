# =============================================================================
# Reservix — параметры проксирования к приложению
# =============================================================================

proxy_http_version 1.1;

# Исходные сведения о клиенте.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Постоянные соединения с приложением: заголовок Connection очищается,
# иначе keepalive в блоке upstream не работает.
proxy_set_header Connection "";

# Формирование объёмного отчёта занимает время; таймаут задан с запасом,
# но не бесконечен — зависшее соединение должно освобождаться.
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Буферизация ответа. Выгрузка файлов идёт потоком, поэтому буферы невелики:
# nginx начинает передачу клиенту, не дожидаясь всего ответа.
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;
proxy_busy_buffers_size 16k;

# Перенаправления, выданные приложением, приводятся к внешнему адресу.
proxy_redirect off;
