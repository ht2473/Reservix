# =============================================================================
# Reservix — конфигурация nginx
# Обратный прокси перед gunicorn.
# =============================================================================

# --- Ограничение частоты запросов --------------------------------------------
# Формы входа и восстановления доступа выделены в отдельную зону: подбор пароля
# должен упираться в ограничение раньше, чем в блокировку учётной записи, иначе
# злоумышленник блокирует чужие записи намеренно.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- Кеш ответов приложения --------------------------------------------------
# Кешируются только публичные страницы: методика, глоссарий, справка.
proxy_cache_path /var/cache/nginx/reservix
                 levels=1:2
                 keys_zone=reservix_cache:16m
                 max_size=512m
                 inactive=30m
                 use_temp_path=off;

upstream reservix_app {
    server web:8000 max_fails=3 fail_timeout=20s;
    keepalive 32;
}

# --- Перенаправление на HTTPS -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name reservix.ru www.reservix.ru;

    # Проверка владения доменом для Let's Encrypt выполняется по HTTP и
    # не должна перенаправляться.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Основной сервер ----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reservix.ru www.reservix.ru;

    ssl_certificate     /etc/letsencrypt/live/reservix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reservix.ru/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/reservix.ru/chain.pem;

    # Только протоколы, не имеющие известных уязвимостей.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/security-headers.conf;

    charset utf-8;
    client_max_body_size 25m;
    client_body_timeout 30s;

    limit_conn conn_limit 24;

    # --- Сжатие ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/woff2;

    # --- Журналы --------------------------------------------------------------
    access_log /var/log/nginx/reservix.access.log;
    error_log  /var/log/nginx/reservix.error.log warn;

    # --- Статика --------------------------------------------------------------
    # Имена файлов статики содержат хеш содержимого (ManifestStaticFilesStorage),
    # поэтому кешировать их можно бессрочно: изменение файла меняет имя.
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Шрифты запрашиваются со страниц того же домена; заголовок нужен для
    # случая, когда система открыта во встроенном фрейме внутреннего портала.
    location ~* \.(woff2?|ttf|otf)$ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "$scheme://$host" always;
        access_log off;
    }

    # --- Защищённые файлы -----------------------------------------------------
    # Внутренняя локация: напрямую недоступна.
    location /protected-media/ {
        internal;
        alias /var/www/media/;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Публичные медиафайлы: фотографии сотрудников для аватаров и изображения
    # материалов базы знаний.
    location /media/public/ {
        alias /var/www/media/public/;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    # --- Ограничение доступа к формам аутентификации ---------------------------
    location ~ ^/account/(login|password/reset)/ {
        limit_req zone=auth_limit burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://reservix_app;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --- Программный интерфейс -------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://reservix_app;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --- Проверка состояния ----------------------------------------------------
    location = /health/ {
        access_log off;
        proxy_pass http://reservix_app;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --- Приложение ------------------------------------------------------------
    location / {
        limit_req zone=general_limit burst=100 nodelay;

        proxy_pass http://reservix_app;
        include /etc/nginx/snippets/proxy-params.conf;

        # Кеш применяется только к ответам, явно разрешившим кеширование.
        proxy_cache reservix_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $cookie_reservix_session $http_hx_request;
        proxy_no_cache $cookie_reservix_session;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- Служебные пути ---------------------------------------------------------
    # Обращения к типовым адресам систем управления содержимым — характерный
    # признак автоматического сканирования. Отвечаем отказом, не нагружая
    # приложение.
    location ~* ^/(wp-admin|wp-login|xmlrpc\.php|\.env|\.git) {
        deny all;
        access_log off;
        return 404;
    }
}
