# =============================================================================
# Reservix — защитные заголовки ответа
# Часть заголовков выставляет Django (политика безопасности содержимого,
# политика разрешений).
# =============================================================================

# Принудительное использование HTTPS. Срок в один год с включением
# поддоменов — значение, требуемое для внесения домена в список
# предзагрузки браузеров.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Запрет угадывания типа содержимого: загруженный документ не должен быть
# интерпретирован браузером как сценарий.
add_header X-Content-Type-Options "nosniff" always;

# Запрет встраивания во фрейм: защита от подмены интерфейса.
add_header X-Frame-Options "DENY" always;

# Ограничение сведений, передаваемых при переходе на внешний ресурс:
# адрес страницы может содержать идентификатор сотрудника.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Отключение браузерных возможностей, которые системе не нужны.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Версия nginx в заголовках не раскрывается.
server_tokens off;
